# Historical/reference settings only. New Railway projects do not apply Config
# as Code; enter these settings in the dashboard using RAILWAY_PRIVATE_BETA.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/_deployment/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
sleepApplication = false
drainingSeconds = 210
overlapSeconds = 0
