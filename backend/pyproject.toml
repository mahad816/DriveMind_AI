[project]
name = "drivemind-backend"
version = "0.1.0"
description = "DriveMind AI — FastAPI backend for agentic Google Drive RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.55.1",
    "google-auth-oauthlib>=1.4.0",
    "greenlet>=3.2.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.10.0",
    "pypdf>=6.14.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "basedpyright>=1.39.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*", "googleapiclient.*", "docx.*", "pytesseract.*", "pypdf.*", "PIL.*"]
ignore_missing_imports = true

[tool.basedpyright]
include = ["app", "tests"]
exclude = [".venv", "**/__pycache__", "alembic/versions"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportAny = "none"
reportPrivateUsage = "none"
reportUnusedCallResult = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"
